<!DOCTYPE html>
<html>
<head>
    <title>Form Data Siswa</title>
</head>

<body>

<table border="1" width="100" cellpadding="15" cellspacing="0" align="center">
    <tr>
        <td>

            <h2 align="center">FORM DATA SISWA</h2>

            <hr>

            <form>

                <table>

                    <tr>
                        <td>Username</td>
                        <td>:</td>
                        <td>
                            <input type="text" name="username">
                        </td>
                    </tr>

                    <tr>
                        <td>Password</td>
                        <td>:</td>
                        <td>
                            <input type="password" name="password">
                        </td>
                    </tr>

                    <tr>
                        <td>Nama Lengkap</td>
                        <td>:</td>
                        <td>
                            <input type="text" name="nama">
                        </td>
                    </tr>

                    <tr>
                        <td>No. Handphone</td>
                        <td>:</td>
                        <td>
                            <input type="text" name="nohp">
                        </td>
                    </tr>

                    <tr>
                        <td>E-Mail</td>
                        <td>:</td>
                        <td>
                            <input type="email" name="email">
                        </td>
                    </tr>

                    <tr>
                        <td>Jenis Kelamin</td>
                        <td>:</td>
                        <td>
                            <input type="radio" name="jk" value="pria"> Laki-laki
                            <input type="radio" name="jk" value="wanita"> Perempuan
                        </td>
                    </tr>

                    <tr>
                        <td>Hobi</td>
                        <td>:</td>
                        <td>
                            <input type="checkbox" name="hobi" value="menyanyi">
                            Badminton
                            <br>

                            <input type="checkbox" name="hobi" value="olahraga">
                            Bersepeda
                            <br>

                            <input type="checkbox" name="hobi" value="membaca">
                            Biliard
                        </td>
                    </tr>

                    <tr>
                        <td>Jurusan</td>
                        <td>:</td>
                        <td>
                            <select name="kompetensi">
                                <option>Rekayasa Perangkat Lunak</option>
                                <option>Teknik Komputer dan Jaringan</option>
                                <option>Akuntansi</option>
                                <option>Management Perkantoran</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>Alamat</td>
                        <td>:</td>
                        <td>
                            <textarea name="alamat" rows="3" cols="25"></textarea>
                        </td>
                    </tr>

                </table>

                <hr>

                <input type="submit" value="Kirim">
                <input type="reset" value="Reset">

            </form>

        </td>
    </tr>
</table>
<a href="index.html">Back to home</a><br>
</body>
</html>
