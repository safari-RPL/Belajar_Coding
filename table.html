<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Tabel Complex</h2>
    <table border="1" cellpadding="5" cellspacing="1">
        <tr>
           <th>No</th>
            <th>Nama</th>
            <th>Kelas</th>
            <th>Jurusan</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Saiful Ahmad Safari</td>
            <td>11 RPL 1</td>
            <td>RPL</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Dafa Cesar Febrianto</td>
            <td>11 RPL 1</td>
            <td>RPL</td>
        </tr>

    </table>

    <h2>Colspan & Rowspan</h2>
    <table border="1" cellspacing="0" cellpadding="5">
        <tr>
            <td colspan="2">1,1</td>
            <td rowspan="3">1,3</td>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
        </tr>
    </table>
        
    
</body>
</html>
