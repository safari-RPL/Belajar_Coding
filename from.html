<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir</title>
</head>
<body>
    <h1>Form Simple Abisss</h1>
    
    <form action="">
        <label for="username">Username:</label><br>
        <input type="text" name="username" placeholder="Masukkan username" required><br><br>
       
        <label for="password">Password:</label><br>
        <input type="password" name="password" placeholder="Masukkan password" required><br><br>
       
        <label for="alamat">Alamat:</label><br>
        <textarea name="alamat" placeholder="Masukkan alamat"></textarea><br>
       
        <label for="Jenis Kelamin">Jenis Kelamin:</label><br>
        <input type="radio" name="Jenis Kelamin" value="Laki-laki"> Laki-laki<br>
        <input type="radio" name="Jenis Kelamin" value="Perempuan"> Perempuan<br><br>

        <label for="Hobi">Hobi:</label><br>
        <input type="checkbox" name="Hobi" value="Membaca"> Membaca<br>
        <input type="checkbox" name="Hobi" value="Biliard"> Biliard<br>
        <input type="checkbox" name="Hobi" value="Berenang"> Badminton<br><br>

        <label for="Jurusan">Jurusan:</label><br>
        <select name="Jurusan">
            <option value="RPL">RPL</option>
            <option value="TKJ">TKJ</option>
            <option value="LP">LP</option>
        </select><br><br>

        <button type="submit">Kirim</button>
        <button type="reset">Reset</button><br><br>

        <a href="index.html">Back to home</a><br>

        
    </form>
    
</body>
</html>
